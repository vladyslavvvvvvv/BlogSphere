{% extends 'base.html' %}
{%block content %}
<div style="margin: auto;
            border: 1px solid black;
            border-radius: 5%;
            padding-left: 20px;
            padding-right: 20px;
            text-decoration: dashed;
            color: rgb(11, 10, 10);
            font-size: larger;
            width: fit-content;">
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <p class="labelfield"> {{field.label}} </p>
    <p class="field"> {{field}} </p>
    {% endfor %}


    <button class="btn btn-outline-success me-2" type="submit">Submit</button>
    <button class="btn btn-sm btn-outline-secondary" onclick=history.back() >Go Back</button>



</form>
</div>
{% endblock %}
