{%extends 'base.html'%}
{%block content %}



<button class="btn btn-light" class="btn-create">
    <a href="{% url 'post-create' %}">Create Post</a>
</button>

{% for post in all_posts %}
<legend class="main">
    {% load static %}

    <h3><img src="{% static 'icon.png' %}" height="25px" width="25px"><a href="{% url 'post-detail' post.id %}" >  {{post.title}}</a></h3>
    <span>{{post.created_at}}</span>
    <hr>
</legend>
{% endfor %}
{% endblock %}
